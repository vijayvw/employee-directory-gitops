name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write 

jobs:
  docker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/employee-app:latest
            ${{ secrets.DOCKER_USERNAME }}/employee-app:${{ github.sha }}
      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq	

      - name: Update Kubernetes Deployment Image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/employee-app:${{ github.sha }}
        run: |
          yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' kubernetes/08-app-deployment.yaml
          
      - name: Commit Deployment Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/08-app-deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update image to ${{ github.sha }}"
          git push
